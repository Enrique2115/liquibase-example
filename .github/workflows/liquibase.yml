on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nombre del tag'
        required: true
        type: string


jobs:
  test-liquibase-action:
    runs-on: ubuntu-latest
    name: Test Liquibase Action
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: liquibase-github-actions/tag@4.30.0
        with:
          tag: ${{ github.event.inputs.tag }}
          url: ${{ secrets.URL }}
          headless: true
          defaultSchemaName: 'sqlschemadefaultliquibase'
          logLevel: 'INFO'
      - uses: liquibase-github-actions/update@v4.29.1
        with:
          classpath: 'changelog'
          changeLogFile: 'master-changelog.yaml'
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          url: ${{ secrets.URL }}
          liquibaseSchemaName: 'sqlschemadefaultliquibase'